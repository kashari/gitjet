# Builds plain binaries for every platform when a version tag (v1.2.3) is pushed and attaches
# them to a GitHub Release. No installers: each archive contains just the gitjet executable.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `targets` is a comma-separated list built on the same runner. Both macOS targets are
        # built on one Apple Silicon runner (x86_64 cross-compiled): a second macOS job was often
        # never given a runner, which held back the whole release.
        include:
          - { name: windows-x86_64, os: windows-latest, targets: x86_64-pc-windows-msvc, archive: zip }
          - { name: windows-aarch64, os: windows-latest, targets: aarch64-pc-windows-msvc, archive: zip }
          - { name: macos, os: macos-latest, targets: "aarch64-apple-darwin,x86_64-apple-darwin", archive: tar.gz }
          - { name: linux-x86_64, os: ubuntu-latest, targets: x86_64-unknown-linux-musl, archive: tar.gz }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-musl, archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Install musl tools
        if: contains(matrix.targets, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          for target in ${MATRIX_TARGETS//,/ }; do
            cargo build --release --locked --target "$target"
          done
        env:
          MATRIX_TARGETS: ${{ matrix.targets }}
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          foreach ($target in "${{ matrix.targets }}" -split ',') {
            $name = "gitjet-$target"
            Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force dist | Out-Null
            Copy-Item "target/$target/release/gitjet.exe" "dist/gitjet.exe"
            Copy-Item README.md, LICENSE dist/
            Compress-Archive -Path dist/* -DestinationPath "$name.zip" -Force
            (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          }
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          for target in ${MATRIX_TARGETS//,/ }; do
            name="gitjet-$target"
            rm -rf dist && mkdir -p dist
            cp "target/$target/release/gitjet" dist/
            cp README.md LICENSE dist/
            tar -C dist -czf "$name.tar.gz" .
            if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          done
        env:
          MATRIX_TARGETS: ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: gitjet-${{ matrix.name }}
          path: |
            gitjet-*.zip
            gitjet-*.zip.sha256
            gitjet-*.tar.gz
            gitjet-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add install scripts
        run: cp install.sh install.ps1 artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
